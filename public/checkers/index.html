  <body>
    <main class="page">
      <section id="lobby">
        <div class="card lobby-card">
          <div class="lobby-icon" style="view-transition-name: icon-checkers"><img src="/checkers/icon.svg" alt="" /></div>
          <h1>Checkers</h1>
          <p class="tagline">Hop, capture, crown a king. Leave your friend without a piece to move.</p>
          <noscript><p class="notice">The games need JavaScript. Turn it on in your browser to play.</p></noscript>
          <p class="how-to-play" inert><a href="#how-to-play">How to play</a></p>
          <label class="field">
            <span>Nickname</span>
            <input type="text" maxlength="20" placeholder="Your nickname (optional)" disabled />
            <small>Saved on this device only.</small>
          </label>
          <details class="settings" inert>
            <summary>
              <span class="settings-title">Game settings</span>
              <span class="settings-change">Change</span>
              <span class="settings-line">
                <span class="chip">No clocks</span>
                <span class="sr-only">, </span>
                <span class="chip">Coin toss</span>
                <span class="sr-only">, </span>
                <span class="chip robot">Easy robot</span>
              </span>
            </summary>
          </details>
          <div class="lobby-actions loading-row">
            <button class="btn primary big" type="button" disabled>Play with a friend</button>
            <button class="btn big" type="button" disabled>Play vs robot</button>
            <button class="btn learn" type="button" disabled>Learn</button>
            <p class="loading" role="status">
              <svg class="loading-piece" viewBox="0 0 80 48" aria-hidden="true">
                <rect class="square" x="2.2" y="15" width="75.6" height="29.4" />
                <path class="square dark" d="M14.8 15h12.6v9.8h-12.6zM40 15h12.6v9.8h-12.6zM65.2 15h12.6v9.8h-12.6zM2.2 24.8h12.6v9.8h-12.6zM27.4 24.8h12.6v9.8h-12.6zM52.6 24.8h12.6v9.8h-12.6zM14.8 34.6h12.6v9.8h-12.6zM40 34.6h12.6v9.8h-12.6zM65.2 34.6h12.6v9.8h-12.6z" />
                <g class="rival" transform="translate(21.1 19.9) scale(0.7)"><ellipse class="checker-side" cy="2" rx="7" ry="5" /><ellipse class="checker-top" rx="7" ry="5" /></g>
                <g class="rival" transform="translate(46.3 19.9) scale(0.7)"><ellipse class="checker-side" cy="2" rx="7" ry="5" /><ellipse class="checker-top" rx="7" ry="5" /></g>
                <g class="rival" transform="translate(71.5 19.9) scale(0.7)"><ellipse class="checker-side" cy="2" rx="7" ry="5" /><ellipse class="checker-top" rx="7" ry="5" /></g>
                <g transform="translate(46.3 39.5) scale(0.7)"><ellipse class="checker-side" cy="2" rx="7" ry="5" /><ellipse class="checker-top" rx="7" ry="5" /></g>
                <g transform="translate(71.5 39.5) scale(0.7)"><ellipse class="checker-side" cy="2" rx="7" ry="5" /><ellipse class="checker-top" rx="7" ry="5" /></g>
                <g transform="translate(21.1 39.5) scale(0.7)">
                  <g class="checker"><ellipse class="checker-side" cy="2" rx="7" ry="5" /><ellipse class="checker-top" rx="7" ry="5" /></g>
                </g>
              </svg>
              <span class="sr-only">Loading…</span>
            </p>
          </div>
        </div>
      </section>
      <section id="game" hidden></section>
    </main>
  </body>
</html>
