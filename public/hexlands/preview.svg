row" d="M98 98q9-3 18 0t18 0M96 122q10-3 20 0t20 0"/><g class="wool"><circle cx="66.7" cy="106" r="3.6"/><circle cx="69.7" cy="104.6" r="3.6"/><circle cx="78.7" cy="118" r="3.4"/><circle cx="81.7" cy="116.6" r="3.4"/></g><path class="ink" d="M145.3 108q7-12 14 0zM160.3 103q6-10 12 0zM155.3 123h11v-5h-11z"/><path class="ink" d="M78.35 151.5q8-7 18 0zM96.35 159.5q7-5 14 0z"/><path class="rob" d="M88.35 153.5c-1-9 2-12 6-12s7 3 6 12q-6 2-12 0z"/><circle class="rob" cx="94.35" cy="138.5" r="4.6"/><g class="glow" style="--d:1.05s"><use href="#hexlands-hex" x="116" y="110"/></g><g class="beat" style="--d:1.05s"><circle class="tok" cx="116" cy="110" r="9.5"/><text class="num" x="116" y="113.8">8</text></g><g class="b"><path class="halo" d="M137.65 122.5L116 135"/><path class="rd" d="M137.65 122.5L116 135"/><path class="pc" d="M130.65 127.5v-8l4-4l4 4v-3h8v11z"/></g><g class="c"><path class="halo" d="M180.95 97.5L180.95 122.5"/><path class="rd" d="M180.95 97.5L180.95 122.5"/><path class="pc" d="M175.35 102.5v-7l5.6-5.6l5.6 5.6v7z"/><rect class="door" x="179.55" y="98.5" width="2.8" height="4"/></g><g class="a"><path class="pc" d="M88.75 102.5v-7l5.6-5.6l5.6 5.6v7z"/><rect class="door" x="92.95" y="98.5" width="2.8" height="4"/></g><g class="gone" style="--d:2.6s"><g class="fade" style="--d:1.4s"><g class="slide" style="--d:1.4s;--x:25.65px;--y:28.5px"><rect class="card" x="84.35" y="73.5" width="12" height="16" rx="2"/><rect class="fi" x="86.35" y="75.5" width="8" height="8" rx="1.2"/><path class="ear" d="M90.35 85.5v-9m0 2l-2-2m2 4l-2-2m2-2l2-2m-2 4l2-2"/></g></g></g><g class="gone" style="--d:2.6s"><g class="fade" style="--d:1.6s"><g class="slide" style="--d:1.6s;--x:-33.65px;--y:-6.5px"><rect class="card" x="143.65" y="108.5" width="12" height="16" rx="2"/><rect class="fi" x="145.65" y="110.5" width="8" height="8" rx="1.2"/><path class="ear" d="M149.65 120.5v-9m0 2l-2-2m2 4l-2-2m2-2l2-2m-2 4l2-2"/></g></g></g><g class="gone" style="--d:2.6s"><g class="fade" style="--d:1.