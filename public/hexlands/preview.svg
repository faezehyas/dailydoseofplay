<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" class="tile-preview pv-hx">
<style>.pv-hx .bg{fill:var(--surface-2)}
.pv-hx .sea{fill:var(--water-2)}
.pv-hx .shoal{fill:var(--water);stroke:var(--water);stroke-width:22;stroke-linejoin:round}
.pv-hx .beach{fill:var(--surface);stroke:var(--surface);stroke-width:9;stroke-linejoin:round}
.pv-hx .wave{fill:none;stroke:var(--water-line);stroke-width:1.6;stroke-linecap:round}
.pv-hx .hex{stroke:var(--surface);stroke-width:2}
.pv-hx .fo{fill:var(--ok)}
.pv-hx .pa{fill:var(--ok);fill-opacity:.5}
.pv-hx .fi{fill:var(--hit-2)}
.pv-hx .hi{fill:var(--hit)}
.pv-hx .mo{fill:var(--ship)}
.pv-hx .de{fill:var(--hit-2);fill-opacity:.32}
.pv-hx .ink{fill:var(--text);opacity:.28}
.pv-hx .peak{fill:var(--sunk);opacity:.4}
.pv-hx .hull{fill:var(--hit);stroke:var(--sunk);stroke-width:1}
.pv-hx .sail{fill:var(--surface);stroke:var(--sunk);stroke-width:1}
.pv-hx .row{fill:none;stroke:var(--text);stroke-width:1.2;stroke-linecap:round;opacity:.22}
.pv-hx .wool{fill:var(--surface)}
.pv-hx .tok{fill:var(--surface);stroke:var(--border)}
.pv-hx .num{fill:var(--danger);font:700 11px var(--font-display);text-anchor:middle}
.pv-hx .rob{fill:var(--sunk);stroke:var(--surface);stroke-width:1.2}
.pv-hx .pc{fill:currentColor;stroke:var(--surface);stroke-width:1.6;stroke-linejoin:round}
.pv-hx .door{fill:var(--text);opacity:.45}
.pv-hx .rd{fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round}
.pv-hx .halo{fill:none;stroke:var(--surface);stroke-width:8;stroke-linecap:round}
.pv-hx .die{fill:var(--surface);stroke:var(--control-border);stroke-width:1.5}
.pv-hx .pip{fill:var(--text)}
.pv-hx .card{fill:var(--surface);stroke:var(--control-border)}
.pv-hx .ear{fill:none;stroke:var(--text);stroke-width:1.1;stroke-linecap:round}
.pv-hx .glow{fill:var(--hit-2);stroke:var(--hit-2);stroke-width:7;stroke-linejoin:round;animation-name:hexlands-glow;animation-duration:1.5s}
.pv-hx .roll{animation-name:hexlands-roll;animation-duration:.8s}
.pv-hx .beat{animation-name:hexlands-beat;animation-duration:.5s}
.pv-hx .draw{animation-duration:.4s}
.pv-hx .roll,.pv-hx .beat{transform-box:fill-box;transform-origin:center}
@keyframes hexlands-roll{from{opacity:0;transform:translate(26px,-70px) rotate(-220deg)}15%{opacity:1}60%{transform:rotate(12deg)}80%{transform:translateY(-3px) rotate(-4deg)}}
@keyframes hexlands-glow{from,to{opacity:0}20%,75%{opacity:1}}
@keyframes hexlands-beat{40%{transform:scale(1.3)}}</style>
<defs><path id="hexlands-hex" d="M0 -25L21.65 -12.5L21.65 12.5L0 25L-21.65 12.5L-21.65 -12.5Z"/><path id="hexlands-tree" d="M0-7l4.4 7h-2.4l3.4 5h-10.8l3.4-5h-2.4z"/></defs>
