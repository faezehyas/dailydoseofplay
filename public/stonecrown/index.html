  <body>
    <main class="page">
      <section id="lobby">
        <div class="card lobby-card">
          <div class="lobby-icon" style="view-transition-name: icon-stonecrown"><img src="/stonecrown/icon.svg" alt="" /></div>
          <h1>Stonecrown</h1>
          <p class="tagline">Draft cards over three ages, raise a wonder, outbuild your neighbours. Nobody deals, nobody peeks.</p>
          <noscript><p class="notice">The games need JavaScript. Turn it on in your browser to play.</p></noscript>
          <p class="how-to-play" inert><a href="#how-to-play">How to play</a></p>
          <label class="field">
            <span>Nickname</span>
            <input type="text" maxlength="20" placeholder="Your nickname (optional)" disabled />
            <small>Saved on this device only.</small>
          </label>
          <details class="settings" inert>
            <summary>
              <span class="settings-title">Game settings</span>
              <span class="settings-change">Change</span>
              <span class="settings-line">
                <span class="chip">No time limit</span>
                <span class="sr-only">, </span>
                <span class="chip robot">Easy robots</span>
              </span>
            </summary>
          </details>
          <div class="lobby-actions loading-row">
            <button class="btn primary big" type="button" disabled>Play with friends</button>
            <div class="robot-play">
              <fieldset class="settings-group players-choice" disabled>
                <legend>Players (you + robots)</legend>
                <div class="seg-options">
                  <label class="seg-opt"><input type="radio" /><span>3</span></label>
                  <label class="seg-opt"><input type="radio" checked /><span>4</span></label>
                </div>
              </fieldset>
              <button class="btn big" type="button" disabled>Play vs 3 robots</button>
            </div>
            <button class="btn learn" type="button" disabled>Learn</button>
            <p class="loading" role="status">
              <svg class="loading-piece" viewBox="0 0 80 48" aria-hidden="true">
                <ellipse class="shade" cx="22" cy="44.5" rx="19" ry="2.5" />
                <rect class="square" x="5" y="34" width="34" height="10" rx="1.5" />
                <rect class="square" x="10" y="25" width="24" height="9" rx="1.5" />
                <g class="place"><path class="stone" d="M15 25v-7h14v7zM14 18l8-6l8 6z" /></g>
                <g transform="translate(42 12) rotate(-9)"><rect class="card-back" width="22" height="30" rx="3" /><rect class="card-trim" x="3" y="3" width="16" height="24" rx="2" /></g>
                <g transform="translate(53 8) rotate(7)">
                  <g class="flip">
                    <rect class="card-face" width="22" height="30" rx="3" /><path class="stone" d="M5 21v-1.6h12v1.6zM6.5 19.4v-6h2v6zM10 19.4v-6h2v6zM13.5 19.4v-6h2v6zM4.5 12.6l6.5-5l6.5 5z" />
                    <g class="flip-back"><rect class="card-back" width="22" height="30" rx="3" /><rect class="card-trim" x="3" y="3" width="16" height="24" rx="2" /></g>
                  </g>
                </g>
              </svg>
              <span class="sr-only">Loading…</span>
            </p>
          </div>
        </div>
      </section>
      <section id="game" hidden></section>
    </main>
