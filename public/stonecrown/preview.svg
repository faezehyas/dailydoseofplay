<g class="fade" style="--d:0.75s"><g class="slide" style="--d:0.75s;--x:30px;--y:-64px"><g class="flip" style="--d:1.66s"><use href="#stonecrown-b" x="230" y="42"/></g><g class="show" style="--d:1.66s"><use href="#stonecrown-k3" x="230" y="42"/></g></g></g>
