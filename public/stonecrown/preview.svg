<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" class="tile-preview pv-sc">
<style>.pv-sc .bg{fill:var(--surface-2)}
.pv-sc .sky{fill:var(--water)}
.pv-sc .sun{fill:color-mix(in srgb,var(--hit-2) 25%,var(--surface))}
.pv-sc .hl{fill:var(--accent-2);opacity:.45}
.pv-sc .gd{fill:var(--accent-2)}
.pv-sc .st{fill:color-mix(in srgb,var(--hit-2) 22%,var(--surface))}
.pv-sc .sd{fill:var(--hit-2);opacity:.28}
.pv-sc .sh{fill:var(--text);opacity:.14}
.pv-sc .lm{fill:var(--hit-2)}
.pv-sc .glow{fill:var(--hit-2);opacity:.3}
.pv-sc .cap{fill:var(--danger)}
.pv-sc .cord{fill:none;stroke:var(--muted);stroke-width:.8}
.pv-sc .gh{fill:none;stroke:var(--control-border);stroke-width:1.2;stroke-dasharray:3 2.5;opacity:.6}
.pv-sc .k1{color:var(--miss)}
.pv-sc .k2{color:var(--danger)}
.pv-sc .k3{color:var(--ok)}
.pv-sc .k4{color:var(--hit-2)}
.pv-sc .k5{color:var(--gift)}
.pv-sc .flip,.pv-sc .show,.pv-sc .rise{transform-box:fill-box;transform-origin:center}
.pv-sc .flip{animation-name:stonecrown-out;animation-duration:.4s;animation-timing-function:ease-in}
.pv-sc .show{animation-name:stonecrown-in;animation-duration:.4s}
.pv-sc .pass{animation-name:stonecrown-pass;animation-duration:.45s;animation-timing-function:ease-in}
.pv-sc .tuck{animation-name:stonecrown-tuck;animation-duration:.6s;animation-timing-function:ease-in-out}
.pv-sc .rise{animation-name:stonecrown-rise;animation-duration:.5s}
@keyframes stonecrown-out{50%,to{transform:scaleX(0)}}
@keyframes stonecrown-in{from,50%{transform:scaleX(0)}}
@keyframes stonecrown-pass{to{transform:translateX(-34px);opacity:0}}
@keyframes stonecrown-tuck{to{transform:translate(-90px,107px)}}
@keyframes stonecrown-rise{from{opacity:0;transform:translateY(18px)}40%{opacity:1}}</style>
