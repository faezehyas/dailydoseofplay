<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tic Tac Toe · Daily Dose of Play</title>
    <meta name="description" content="Free Tic Tac Toe (noughts and crosses) with a friend or vs a robot. No sign-up." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12151c" media="(prefers-color-scheme: dark)" />
    <link rel="preload" href="/engine/fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/engine/theme.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="modulepreload" href="/engine/lobby.js" />
    <link rel="modulepreload" href="/engine/native.js" />
    <link rel="modulepreload" href="/engine/session.js" />
    <link rel="modulepreload" href="/engine/turn-match.js" />
    <link rel="modulepreload" href="/engine/shell.js" />
    <link rel="modulepreload" href="/engine/players.js" />
    <link rel="modulepreload" href="/engine/result.js" />
    <link rel="modulepreload" href="/engine/celebrate.js" />
    <link rel="modulepreload" href="/engine/confirm.js" />
    <link rel="modulepreload" href="/engine/robot-record.js" />
    <link rel="modulepreload" href="/engine/room.js" />
    <link rel="modulepreload" href="/engine/how-to-play.js" />
    <link rel="modulepreload" href="/engine/reactions.js" />
    <link rel="modulepreload" href="/engine/channel.js" />
    <link rel="modulepreload" href="/engine/group.js" />
    <link rel="modulepreload" href="/engine/names.js" />
    <link rel="modulepreload" href="/engine/fair.js" />
    <link rel="modulepreload" href="/engine/robot-pace.js" />
    <link rel="modulepreload" href="/engine/prefs.js" />
    <link rel="modulepreload" href="/engine/chimes.js" />
    <link rel="modulepreload" href="/engine/rng.js" />
    <link rel="modulepreload" href="/engine/settings.js" />
    <link rel="modulepreload" href="/engine/signaling.js" />
    <link rel="modulepreload" href="/engine/peer.js" />
    <link rel="modulepreload" href="/engine/sound.js" />
    <link rel="modulepreload" href="/engine/synth.js" />
    <link rel="modulepreload" href="/engine/loudness.js" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main class="page">
      <section id="lobby">
        <div class="card lobby-card">
          <div class="lobby-icon" style="view-transition-name: icon-tic-tac-toe"><img src="/tic-tac-toe/icon.svg" alt="" /></div>
          <h1>Tic Tac Toe</h1>
          <p class="tagline">Line them up before your friend does. Quick to learn, sneaky to master.</p>
          <noscript><p class="notice">The games need JavaScript. Turn it on in your browser to play.</p></noscript>
          <p class="how-to-play" inert><a href="#how-to-play">How to play</a></p>
          <label class="field">
            <span>Nickname</span>
            <input type="text" maxlength="20" placeholder="Your nickname (optional)" disabled />
            <small>Saved on this device only.</small>
          </label>
          <details class="settings" inert>
            <summary>
              <span class="settings-title">Game settings</span>
              <span class="settings-change">Change</span>
              <span class="settings-line">
                <span class="chip">3 × 3</span>
                <span class="sr-only">, </span>
                <span class="chip">30 s a move</span>
                <span class="sr-only">, </span>
                <span class="chip">2 min each</span>
                <span class="sr-only">, </span>
                <span class="chip">Coin toss</span>
              </span>
            </summary>
          </details>
          <div class="lobby-actions">
            <button class="btn primary big" type="button" disabled>Play with a friend</button>
            <button class="btn big" type="button" disabled>Play vs robot</button>
            <button class="btn learn" type="button" disabled>Learn</button>
          </div>
          <p class="loading" role="status"><span class="spinner"></span><span class="sr-only">Loading…</span></p>
        </div>
      </section>
      <section id="game" hidden></section>
    </main>
  </body>
</html>
